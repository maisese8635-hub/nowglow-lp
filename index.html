<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOW&GLOW | 伴走パートナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; scroll-behavior: smooth; }
        .fade-in { opacity: 0; transform: translateY(20px); transition: all 1s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        .text-gradient { 
            background: linear-gradient(90deg, #e17c7c, #f3a683); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .hero-bg {
            background-image: linear-gradient(rgba(255, 252, 250, 0.9), rgba(255, 252, 250, 0.95)), 
                              url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
        }
        /* PCサイズで1行を維持しつつ、はみ出しを防ぐ */
        @media (min-width: 1024px) {
            .force-single-line { 
                white-space: nowrap !important; 
                display: inline-block;
                width: auto;
            }
        }
    </style>
</head>
<body class="bg-[#fdfaf8] text-[#4a4440] antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FadeInSection = ({ children }) => {
            const [isVisible, setVisible] = useState(false);
            const domRef = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => { if (entry.isIntersecting) setVisible(true); });
                });
                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={domRef} className={`fade-in ${isVisible ? 'visible' : ''}`}>{children}</div>;
        };

        function App() {
            return (
                <div className="min-h-screen">
                    {/* --- NAVIGATION --- */}
                    <header className="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md py-4 border-b border-rose-50">
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="font-black text-xl tracking-[0.3em]">NOW&GLOW</div>
                            <nav className="hidden md:flex gap-8 text-[10px] font-black tracking-widest text-[#8e7f77]">
                                <a href="#problem" className="hover:text-rose-400">PROBLEM</a>
                                <a href="#value" className="hover:text-rose-400">VALUE</a>
                                <a href="#price" className="hover:text-rose-400">PRICE</a>
                                <a href="#thought" className="hover:text-rose-400">THOUGHT</a>
                            </nav>
                            <a href="#contact" className="text-[10px] font-bold tracking-widest text-rose-400 border-b border-rose-300 hover:text-rose-500">CONTACT</a>
                        </div>
                    </header>

                    {/* --- HERO --- */}
                    <section className="hero-bg min-h-screen flex items-center pt-20 px-6">
                        <div className="max-w-4xl mx-auto w-full">
                            <FadeInSection>
                                <p className="text-[10px] font-black tracking-[0.4em] text-rose-400 mb-6 uppercase">Creative Partnership</p>
                                <h1 className="text-5xl md:text-8xl font-black leading-tight mb-8">
                                    先生じゃない。<br />
                                    <span className="text-gradient">「完了」</span>させる<br />
                                    パートナー。
                                </h1>
                                <p className="text-lg md:text-xl text-[#8e7f77] font-bold mb-10 max-w-2xl leading-relaxed">
                                    「やり方はわかっている。でも動けない」のは、あなたが悪いのではありません。必要なのは知識ではなく、隣で共に走る「環境」と「強制力」です。
                                </p>
                                <a href="#contact" className="inline-block px-10 py-5 bg-[#4a4440] text-white text-[10px] font-black tracking-widest uppercase rounded-full hover:bg-black transition-colors">Explore Plans</a>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- PROBLEM (3つに復元) --- */}
                    <section id="problem" className="py-32 bg-[#f7f1ed]">
                        <div className="max-w-5xl mx-auto px-6">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-400 uppercase mb-16">Problem</h2>
                                <h3 className="text-3xl md:text-5xl font-black mb-16 leading-tight">
                                    あなたが「動けない」<br />本当の理由。
                                </h3>
                                <div className="grid md:grid-cols-3 gap-12">
                                    <div className="border-l border-rose-200 pl-8">
                                        <p className="text-sm font-bold text-rose-400 mb-4">Case 01</p>
                                        <p className="text-[#8e7f77] text-sm leading-relaxed">ノウハウは溢れているのに、なぜか一人では形にならない。</p>
                                    </div>
                                    <div className="border-l border-rose-200 pl-8">
                                        <p className="text-sm font-bold text-rose-400 mb-4">Case 02</p>
                                        <p className="text-[#8e7f77] text-sm leading-relaxed">一人で試行錯誤して、気づけば数時間が過ぎている（時間の停滞）。</p>
                                    </div>
                                    <div className="border-l border-rose-200 pl-8">
                                        <p className="text-sm font-bold text-rose-400 mb-4">Case 03</p>
                                        <p className="text-[#8e7f77] text-sm leading-relaxed">プロに頼みたいけれど、高額な外注費やミスマッチが不安。</p>
                                    </div>
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- WHO WE SERVE (縦並び) --- */}
                    <section className="py-32 bg-white">
                        <div className="max-w-3xl mx-auto px-6">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-200 uppercase mb-20 text-center">Who we serve</h2>
                                <div className="space-y-24">
                                    <div className="border-l-4 border-rose-100 pl-8">
                                        <h3 className="text-2xl font-black mb-4">創業初期の起業家さん</h3>
                                        <p className="text-[#8e7f77] leading-loose">プロに丸投げする予算はないけれど、自分一人で進めるには限界を感じているあなたへ。一緒に整理して形にしましょう。</p>
                                    </div>
                                    <div className="border-l-4 border-rose-100 pl-8">
                                        <h3 className="text-2xl font-black mb-4">「終わらせたい」フリーランスさん</h3>
                                        <p className="text-[#8e7f77] leading-loose">お仕事はあるのに、一人だとつい後回しにしてしまうあなたへ。誰かと「一緒にやる時間」を作ることで、驚くほどスムーズに完了します。</p>
                                    </div>
                                    <div className="border-l-4 border-rose-100 pl-8">
                                        <h3 className="text-2xl font-black mb-4">一歩を踏み出したいあなた</h3>
                                        <p className="text-[#8e7f77] leading-loose">「何かしたいけど、どこから始めればいい？」という準備段階のあなたへ。内側にある価値を言葉とビジュアルに変えていきます。</p>
                                    </div>
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- VALUE (1行強制の再調整) --- */}
                    <section id="value" className="py-32 bg-[#fdfaf8]">
                        <div className="max-w-6xl mx-auto px-6">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-300 uppercase mb-20">Our Value</h2>
                                <div className="grid md:grid-cols-3 gap-8">
                                    <div className="bg-white p-10 rounded-[2rem] shadow-sm border border-rose-50">
                                        <h4 className="font-black text-xl mb-6 text-rose-400">時間の最適化</h4>
                                        <p className="text-sm text-[#8e7f77] leading-relaxed font-medium">一人で何時間も悩む停滞を突破。あなたが注力すべき場所へ時間を戻します。</p>
                                    </div>
                                    <div className="bg-white p-10 rounded-[2rem] shadow-sm border border-rose-50">
                                        <h4 className="font-black text-xl mb-6 text-rose-400">優しい客観視</h4>
                                        <p className="text-sm text-[#8e7f77] leading-relaxed font-medium">自分だけでは気づけない限界を、対話を通してワクワクする発見に変えます。</p>
                                    </div>
                                    <div className="bg-white p-10 rounded-[2rem] shadow-sm border border-rose-50 overflow-hidden">
                                        <h4 className="font-black text-xl mb-6 text-rose-400">「完了」の喜び</h4>
                                        <p className="text-sm text-[#8e7f77] leading-relaxed font-medium force-single-line">
                                            画面を共有しながら、その場でCanvaやSNSを「1本完成」まで導きます。
                                        </p>
                                    </div>
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- TIME SAVER (復活) --- */}
                    <section className="py-32 bg-white">
                        <div className="max-w-5xl mx-auto px-6">
                            <FadeInSection>
                                <div className="flex flex-col md:flex-row items-center gap-12 bg-[#fdfaf8] rounded-[3rem] p-10 md:p-16 border border-rose-100 shadow-sm">
                                    <div className="md:w-1/2">
                                        <h2 className="text-3xl md:text-4xl font-black mb-8 leading-tight text-[#4a4440]">
                                            タイムセーバー<br /><span className="text-rose-400">（時間の節約者）</span>
                                        </h2>
                                        <p className="text-lg md:text-xl font-bold leading-relaxed mb-6">
                                            私は凄腕のクリエイターではありません。<br />
                                            <span className="text-rose-400 underline decoration-rose-100 decoration-8 underline-offset-4">「あなたの行動を止めない」</span>プロです。
                                        </p>
                                        <p className="text-sm text-[#8e7f77] leading-loose">
                                            あなたが一人で20時間悩む損失を、私との5時間で「価値ある完成」に変えます。
                                        </p>
                                    </div>
                                    <div className="md:w-1/2 bg-white p-10 rounded-3xl border border-rose-50 text-center shadow-inner">
                                        <div className="text-[#8e7f77] text-2xl font-black mb-4 line-through opacity-30">¥100,000の損失</div>
                                        <div className="text-rose-300 text-3xl mb-4 font-black">↓</div>
                                        <div className="text-[#4a4440] text-4xl font-black mb-2">¥55,000の価値</div>
                                        <p className="text-[10px] text-rose-300 font-bold uppercase tracking-widest">Efficiency Improvement</p>
                                    </div>
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- PRICE --- */}
                    <section id="price" className="py-32 bg-white px-6">
                        <div className="max-w-6xl mx-auto">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-300 uppercase mb-20 text-center">Price Plans</h2>
                                <div className="grid md:grid-cols-3 gap-8 mb-20">
                                    <div className="bg-[#fdfaf8] p-10 rounded-3xl border border-rose-50">
                                        <h5 className="font-bold mb-4">習慣化コミュニティ</h5>
                                        <p className="text-2xl font-black text-rose-400">¥2,980/月</p>
                                    </div>
                                    <div className="bg-white p-10 rounded-3xl border-2 border-rose-300 shadow-xl relative scale-105 z-10">
                                        <div className="absolute -top-4 left-6 bg-rose-400 text-white px-3 py-1 text-[8px] font-black uppercase">Popular</div>
                                        <h5 className="font-bold mb-4">お試し伴走（60分）</h5>
                                        <p className="text-2xl font-black text-rose-400">¥5,000/回</p>
                                    </div>
                                    <div className="bg-[#fdfaf8] p-10 rounded-3xl border border-rose-50">
                                        <h5 className="font-bold mb-4">スタンダードプラン</h5>
                                        <p className="text-2xl font-black text-rose-400">¥35,000/月</p>
                                    </div>
                                </div>

                                <div className="bg-[#f7f1ed] p-10 md:p-16 rounded-[3rem]">
                                    <p className="text-center font-black text-xl mb-12 uppercase tracking-widest">Practical Support (実務代行)</p>
                                    <div className="grid md:grid-cols-3 gap-12">
                                        <div className="text-center">
                                            <p className="font-bold text-sm mb-2">デザイン代行</p>
                                            <p className="text-rose-400 font-black mb-4">¥3,000〜</p>
                                            <p className="text-[10px] text-[#8e7f77]">SNS画像・名刺など</p>
                                        </div>
                                        <div className="text-center border-x border-rose-200/50 px-4">
                                            <p className="font-bold text-sm mb-2">WEB制作</p>
                                            <p className="text-rose-400 font-black mb-4">¥100,000〜</p>
                                            <p className="text-[10px] text-[#8e7f77]">LP作成・リニューアル</p>
                                        </div>
                                        <div className="text-center">
                                            <p className="font-bold text-sm mb-2">ショート動画制作</p>
                                            <p className="text-rose-400 font-black mb-4">¥10,000〜</p>
                                            <p className="text-[10px] text-[#8e7f77] force-single-line">リール・TikTok編集。納品まで完了します。</p>
                                        </div>
                                    </div>
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- THOUGHT (復活) --- */}
                    <section id="thought" className="py-32 bg-[#fdfaf8]">
                        <div className="max-w-4xl mx-auto px-6 text-center">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-300 uppercase mb-16 text-center">My Thought</h2>
                                <p className="text-xl md:text-2xl font-bold leading-loose text-[#4a4440]">
                                    技術を教えるのではなく、<br />
                                    あなたの想いをスッキリ整理し、<br />
                                    最短距離で形にする。<br />
                                    <span className="text-rose-400">「並走者」でありたい。</span>
                                </p>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- WORKFLOW --- */}
                    <section className="py-32 bg-white">
                        <div className="max-w-4xl mx-auto px-6">
                            <FadeInSection>
                                <h2 className="text-xs font-black tracking-[0.5em] text-rose-200 uppercase mb-20 text-center">Workflow</h2>
                                <div className="space-y-12">
                                    {[
                                        { s: "01", t: "無料の作戦会議", d: "公式LINEからお申し込み。30分ほど状況を整理しましょう。" },
                                        { s: "02", t: "プランのご提案", d: "あなたに最適な並走スタイルをご提案します。" },
                                        { s: "03", t: "伴走スタート", d: "一緒に笑いながら、事業を形にしていきましょう！" }
                                    ].map((step, i) => (
                                        <div key={i} className="flex gap-8 items-start">
                                            <span className="text-3xl font-black italic text-rose-100">{step.s}</span>
                                            <div>
                                                <h5 className="font-bold text-lg mb-2">{step.t}</h5>
                                                <p className="text-sm text-[#8e7f77] font-medium">{step.d}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </FadeInSection>
                        </div>
                    </section>

                    {/* --- CTA --- */}
                    <section id="contact" className="py-40 bg-[#4a4440] text-white text-center px-6">
                        <FadeInSection>
                            <h2 className="text-4xl md:text-6xl font-black mb-12 leading-tight">
                                悩む時間を、<br />完了させる喜びに.
                            </h2>
                            <a href="#" className="inline-block px-12 py-6 bg-rose-400 rounded-full text-[10px] font-black tracking-widest uppercase hover:scale-110 transition-transform">Apply via LINE</a>
                        </FadeInSection>
                    </section>

                    {/* --- FOOTER --- */}
                    <footer className="py-12 bg-white border-t border-rose-50 text-center">
                        <div className="font-black tracking-[0.4em] mb-4">NOW&GLOW</div>
                        <p className="text-[10px] text-rose-200">© 2024 NOW&GLOW</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
